<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f6f3" />
    <title>每日打卡</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="banner" class="banner" role="status" aria-live="polite" hidden>
      <span id="bannerText"></span>
    </div>

    <main class="page">
      <section class="hero">
        <div class="hero-top">
          <div>
            <h1>每日打卡</h1>
            <p id="dateLabel" class="date-label"></p>
          </div>
          <button id="manageBtn" class="manage-btn" type="button" hidden>管理</button>
        </div>

        <div class="summary" aria-live="polite">
          <p class="summary-label">今天完成</p>
          <p class="summary-count">
            <strong id="doneCount">0</strong><span class="slash">/</span><span id="totalCount" class="total">0</span><span class="unit">项</span>
          </p>
        </div>

        <p id="allDone" class="all-done" hidden>全部完成，太棒了 🎉</p>

        <div id="progressWrap" class="progress-wrap" hidden>
          <div class="progress-track">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </section>

      <form id="addForm" class="add-form" autocomplete="off">
        <label class="sr-only" for="habitInput">新习惯名称</label>
        <input
          id="habitInput"
          class="habit-input"
          type="text"
          maxlength="30"
          placeholder="添加新习惯，例如：喝水"
        />
        <button id="addBtn" class="add-btn" type="submit">添加</button>
      </form>

      <p id="manageHint" class="manage-hint" hidden>管理模式下不会打勾，点“删除”可移除习惯</p>

      <ul id="habitList" class="habit-list"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
